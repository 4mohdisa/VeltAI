# Shared proxy headers for the Lume API.
# Install to /etc/nginx/snippets/lume-proxy.conf

proxy_http_version 1.1;

# Preserve the client's view of the request. The app derives nothing
# security-relevant from these headers (the rate limiter deliberately keys on
# RemoteAddr, not X-Forwarded-For, because a client-settable header would let
# an attacker mint a fresh bucket per request) — but they matter for logs and
# for any future proxy-aware logic.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# Do not let a client smuggle its own forwarding headers through: nginx
# overwrites the ones above, and these two are cleared so nothing downstream
# can be confused by attacker-supplied values.
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Server "";

proxy_redirect off;
proxy_buffering on;

# Default timeouts; the /api/ location overrides with longer ones for AI calls.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;
