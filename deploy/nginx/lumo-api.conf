# Lumo API — nginx reverse proxy and TLS terminator.
#
# Install:  /etc/nginx/sites-available/lumo-api.conf  (symlink into sites-enabled)
# Replace every api.example.com with your real hostname before use.
#
# This is the ONLY thing on the box listening publicly. The API container binds
# 127.0.0.1:8080 and is unreachable from the internet except through here.
#
# The rate limits below are the EDGE layer. They are not a duplicate of the
# app's per-user limits — they catch what the app's limiter structurally
# cannot: floods from unauthenticated clients (which never reach a user id),
# and floods large enough that the cost is in accepting the connection at all.

# --- Shared rate-limit zones (http context) ---------------------------------
# Must live in the http{} block. If you keep this file in sites-enabled (which
# is included inside http{}), these belong here; if nginx complains about
# context, move the three limit_* lines to /etc/nginx/nginx.conf.
#
# 10m of shared memory holds ~160k IPs. Keyed on the ORIGINAL client IP.
limit_req_zone $binary_remote_addr zone=lumo_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=lumo_auth:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=lumo_webhook:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=lumo_conn:10m;

# Cache the OCSP response so TLS handshakes do not block on an OCSP fetch.
# ssl_stapling needs a resolver; use the systemd stub or your VPC resolver.
resolver 127.0.0.53 valid=300s ipv6=off;
resolver_timeout 5s;

# --- HTTP: redirect everything to HTTPS, except the ACME challenge ----------
server {
    listen 80;
    listen [::]:80;
    server_name api.example.com;

    # Let's Encrypt http-01 challenge must stay reachable over plain HTTP, or
    # renewal fails and the certificate silently expires.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ------------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.example.com;

    # --- TLS ---------------------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/api.example.com/chain.pem;

    # TLS 1.2 minimum. 1.3 first. No TLS 1.0/1.1 — both are deprecated and
    # neither is needed by any iOS version this app supports.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Forward secrecy only; no static-RSA, no CBC, no RC4.
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;   # client preference is better on modern stacks
    ssl_session_timeout 1d;
    ssl_session_cache shared:LumoSSL:10m;
    ssl_session_tickets off;         # tickets weaken forward secrecy without rotation
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- Security headers --------------------------------------------------
    # HSTS: 2 years, subdomains, preload-eligible. NOTE: this is a commitment —
    # once a browser sees it, that hostname is HTTPS-only for max-age. Do not
    # enable preload until you are certain every subdomain can do TLS forever.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    # The app sets these too; both layers is deliberate (see cmd/server securityHeaders).

    # Do not advertise the nginx version in headers or error pages.
    server_tokens off;

    # --- Body size ---------------------------------------------------------
    # Defence in depth in front of the app's own caps. The scan routes accept a
    # base64 image; the app caps the DECODED bytes at 15 MB, and base64 inflates
    # by ~4/3, so 24 MB is the matching ceiling with headroom for the JSON
    # envelope. Oversize is rejected here, before it ever reaches Go — nginx
    # closes the connection instead of the app buffering megabytes.
    client_max_body_size 24m;
    client_body_buffer_size 256k;

    # --- Timeouts ----------------------------------------------------------
    # No unbounded connections. A slowloris client that dribbles headers or body
    # is cut off rather than holding a worker forever.
    client_body_timeout 30s;
    client_header_timeout 15s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # --- Connection limit --------------------------------------------------
    limit_conn lumo_conn 20;

    # Return JSON, not an nginx HTML error page, so the app's client always
    # gets a parseable body (its envelope parser handles non-JSON, but this
    # keeps error shapes consistent).
    limit_req_status 429;
    limit_conn_status 429;

    # --- Webhooks: public by necessity, signature-verified by the app ------
    # These CANNOT require auth (Clerk and RevenueCat call them), so they are
    # the most exposed surface. Tighter rate limit; the app still verifies the
    # signature and fails closed on an unconfigured secret.
    location /api/webhooks/ {
        limit_req zone=lumo_webhook burst=20 nodelay;
        client_max_body_size 1m;          # webhook bodies are small; app caps at 1 MB
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lumo-proxy.conf;
    }

    # --- OAuth callback: browser redirect, also public ---------------------
    location ~ ^/api/integrations/[^/]+/callback$ {
        limit_req zone=lumo_auth burst=10 nodelay;
        client_max_body_size 16k;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lumo-proxy.conf;
    }

    # --- Health: local checks only ----------------------------------------
    # Reachable from the box (and your uptime monitor if you allow its IPs).
    # Not a secret, but there is no reason to serve it to the world.
    location = /health {
        access_log off;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lumo-proxy.conf;
    }

    # --- Everything else ---------------------------------------------------
    location /api/ {
        limit_req zone=lumo_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:8080;
        include /etc/nginx/snippets/lumo-proxy.conf;

        # Scan uploads and AI calls are slow by nature. Long enough not to cut
        # off a legitimate Gemini round-trip, short enough that a stuck
        # upstream cannot hold connections indefinitely.
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Anything not under /api or /health is not part of this service.
    location / {
        return 404;
    }
}
